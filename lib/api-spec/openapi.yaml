openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Festiland point of sale, inventory, and accounting API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: store
  - name: products
  - name: sales
  - name: inventory
  - name: contacts
  - name: accounting
  - name: team
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /me:
    get:
      operationId: getMe
      tags: [store]
      summary: Get the signed-in team member and effective role
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamUser"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [store]
      summary: Sales, stock, and accounting overview
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: Search and filter the product catalog
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: lowStock
          schema: { type: boolean }
      responses:
        "200":
          description: Product list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Product" }
    post:
      operationId: createProduct
      tags: [products]
      summary: Add a product or service
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
  /products/{productId}:
    patch:
      operationId: updateProduct
      tags: [products]
      summary: Update product details
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductUpdate" }
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
  /sales:
    get:
      operationId: listSales
      tags: [sales]
      summary: List recent sales and payment status
      parameters:
        - in: query
          name: search
          schema: { type: string }
      responses:
        "200":
          description: Sales list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Sale" }
    post:
      operationId: createSale
      tags: [sales]
      summary: Complete a point-of-sale transaction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaleInput" }
      responses:
        "201":
          description: Completed sale with receipt details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sale" }
  /sales/{saleId}/refund:
    post:
      operationId: refundSale
      tags: [sales]
      summary: Refund a sale and restore inventory
      parameters:
        - in: path
          name: saleId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefundInput" }
      responses:
        "200":
          description: Refunded sale
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sale" }
  /inventory/adjustments:
    get:
      operationId: listInventoryAdjustments
      tags: [inventory]
      summary: Inventory movement history
      responses:
        "200":
          description: Adjustment list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/InventoryAdjustment" }
    post:
      operationId: createInventoryAdjustment
      tags: [inventory]
      summary: Record a stock count, loss, or correction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InventoryAdjustmentInput" }
      responses:
        "201":
          description: Stock adjustment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventoryAdjustment" }
  /customers:
    get:
      operationId: listCustomers
      tags: [contacts]
      summary: List customers
      parameters:
        - in: query
          name: search
          schema: { type: string }
      responses:
        "200":
          description: Customer list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Contact" }
    post:
      operationId: createCustomer
      tags: [contacts]
      summary: Create a customer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactInput" }
      responses:
        "201":
          description: Created customer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contact" }
  /suppliers:
    get:
      operationId: listSuppliers
      tags: [contacts]
      summary: List suppliers
      parameters:
        - in: query
          name: search
          schema: { type: string }
      responses:
        "200":
          description: Supplier list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Contact" }
    post:
      operationId: createSupplier
      tags: [contacts]
      summary: Create a supplier
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactInput" }
      responses:
        "201":
          description: Created supplier
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contact" }
  /tax-rates:
    get:
      operationId: listTaxRates
      tags: [accounting]
      summary: List configurable taxes without imposing defaults
      responses:
        "200":
          description: Tax rates
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TaxRate" }
    post:
      operationId: createTaxRate
      tags: [accounting]
      summary: Add a configurable tax rate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaxRateInput" }
      responses:
        "201":
          description: Created tax rate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaxRate" }
  /tax-rates/{taxRateId}:
    patch:
      operationId: updateTaxRate
      tags: [accounting]
      summary: Update a tax rate
      parameters:
        - in: path
          name: taxRateId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaxRateUpdate" }
      responses:
        "200":
          description: Updated tax rate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaxRate" }
  /expenses:
    get:
      operationId: listExpenses
      tags: [accounting]
      summary: List expenses and payment status
      responses:
        "200":
          description: Expenses
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Expense" }
    post:
      operationId: createExpense
      tags: [accounting]
      summary: Record an expense and its accounting entry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExpenseInput" }
      responses:
        "201":
          description: Recorded expense
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Expense" }
  /accounts:
    get:
      operationId: listAccounts
      tags: [accounting]
      summary: Get the chart of accounts
      responses:
        "200":
          description: Accounts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Account" }
    post:
      operationId: createAccount
      tags: [accounting]
      summary: Add an account to the chart of accounts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountInput" }
      responses:
        "201":
          description: Created account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
  /journal-entries:
    get:
      operationId: listJournalEntries
      tags: [accounting]
      summary: Browse double-entry accounting entries
      responses:
        "200":
          description: Journal entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/JournalEntry" }
    post:
      operationId: createJournalEntry
      tags: [accounting]
      summary: Post a balanced manual journal entry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JournalEntryInput" }
      responses:
        "201":
          description: Posted entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalEntry" }
  /purchases:
    get:
      operationId: listPurchases
      tags: [inventory]
      summary: List supplier purchases
      responses:
        "200":
          description: Purchases
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Purchase" }
    post:
      operationId: createPurchase
      tags: [inventory]
      summary: Record a supplier purchase and receive stock
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PurchaseInput" }
      responses:
        "201":
          description: Recorded purchase
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Purchase" }
  /store-settings:
    get:
      operationId: getStoreSettings
      tags: [store]
      summary: Get shared business and receipt settings
      responses:
        "200":
          description: Business settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreSettings" }
    patch:
      operationId: updateStoreSettings
      tags: [store]
      summary: Save shared business settings and accounting period lock
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StoreSettingsUpdate" }
      responses:
        "200":
          description: Saved settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreSettings" }
  /cash-sessions:
    get:
      operationId: listCashSessions
      tags: [sales]
      summary: List the cashier's cash sessions
      responses:
        "200":
          description: Cash sessions with expected balances
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CashSession" }
    post:
      operationId: openCashSession
      tags: [sales]
      summary: Open a cash session using a physical opening count
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CashSessionInput" }
      responses:
        "201":
          description: Opened cash session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CashSession" }
  /cash-sessions/{sessionId}/close:
    post:
      operationId: closeCashSession
      tags: [sales]
      summary: Close a cash session and store the cash count difference
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CashSessionCloseInput" }
      responses:
        "200":
          description: Closed cash session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CashSession" }
  /audit-log:
    get:
      operationId: listAuditLog
      tags: [store]
      summary: Browse recent audit events
      responses:
        "200":
          description: Audit events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditEvent" }
  /settlements:
    get:
      operationId: listSettlements
      tags: [accounting]
      summary: List customer collections and supplier payments
      parameters:
        - in: query
          name: direction
          schema: { type: string, enum: [receivable, payable] }
      responses:
        "200":
          description: Balance settlements
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Settlement" }
    post:
      operationId: createSettlement
      tags: [accounting]
      summary: Collect a customer balance or pay a supplier
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettlementInput" }
      responses:
        "201":
          description: Recorded settlement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settlement" }
  /reports/financial:
    get:
      operationId: getFinancialReport
      tags: [accounting]
      summary: Income statement, cash, and receivable/payable totals
      parameters:
        - in: query
          name: from
          required: true
          schema: { type: string, format: date }
        - in: query
          name: to
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Financial report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinancialReport" }
  /team:
    get:
      operationId: listTeam
      tags: [team]
      summary: List staff and application roles
      responses:
        "200":
          description: Team
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TeamUser" }
  /team/{userId}/role:
    patch:
      operationId: updateTeamRole
      tags: [team]
      summary: Change a team member's application role
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamRoleInput" }
      responses:
        "200":
          description: Updated staff member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamUser" }
  /auth/session:
    get:
      operationId: getAuthSession
      tags: [auth]
      summary: Get the current local session
      responses:
        "200":
          description: Local session state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in locally with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke the current session
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessMessage" }
  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change your local password and revoke prior sessions
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordChangeInput" }
      responses:
        "200":
          description: Password changed and session renewed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
  /team/accounts:
    post:
      operationId: createTeamAccount
      tags: [team]
      summary: Create a local staff account with a temporary password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamAccountInput" }
      responses:
        "201":
          description: Local account created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamUser" }
  /team/{userId}/password:
    post:
      operationId: resetTeamPassword
      tags: [team]
      summary: Set a temporary local password and revoke sessions
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetInput" }
      responses:
        "200":
          description: Temporary password assigned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessMessage" }
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]
    TeamRole:
      type: string
      enum: [owner, manager, cashier, inventory, accountant]
    TeamUser:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/TeamRole" }
        active: { type: boolean }
        hasLocalLogin: { type: boolean }
        mustChangePassword: { type: boolean }
      required: [id, email, name, role, active, hasLocalLogin, mustChangePassword]
    TeamRoleInput:
      type: object
      properties:
        role: { $ref: "#/components/schemas/TeamRole" }
        active: { type: boolean }
      required: [role]
    AuthSession:
      type: object
      properties:
        user:
          anyOf:
            - { $ref: "#/components/schemas/TeamUser" }
            - { type: "null" }
        setupRequired: { type: boolean }
      required: [user, setupRequired]
    LoginInput:
      type: object
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 128 }
      required: [email, password]
    PasswordChangeInput:
      type: object
      properties:
        currentPassword: { type: string, minLength: 1, maxLength: 128 }
        newPassword: { type: string, minLength: 12, maxLength: 128 }
      required: [currentPassword, newPassword]
    PasswordResetInput:
      type: object
      properties:
        temporaryPassword: { type: string, minLength: 12, maxLength: 128 }
      required: [temporaryPassword]
    SuccessMessage:
      type: object
      properties:
        message: { type: string }
      required: [message]
    TeamAccountInput:
      type: object
      properties:
        email: { type: string, format: email, maxLength: 254 }
        name: { type: string, minLength: 1, maxLength: 120 }
        temporaryPassword: { type: string, minLength: 12, maxLength: 128 }
        role: { $ref: "#/components/schemas/TeamRole" }
      required: [email, name, temporaryPassword, role]
    Dashboard:
      type: object
      properties:
        todaySales: { type: number }
        todayTransactions: { type: integer }
        lowStockCount: { type: integer }
        cashBalance: { type: number }
        accountsReceivable: { type: number }
        accountsPayable: { type: number }
        recentSales:
          type: array
          items: { $ref: "#/components/schemas/Sale" }
        topProducts:
          type: array
          items: { $ref: "#/components/schemas/TopProduct" }
      required: [todaySales, todayTransactions, lowStockCount, cashBalance, accountsReceivable, accountsPayable, recentSales, topProducts]
    TopProduct:
      type: object
      properties:
        productId: { type: string }
        name: { type: string }
        quantity: { type: number }
        revenue: { type: number }
      required: [productId, name, quantity, revenue]
    Product:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        sku: { type: ["string", "null"] }
        barcode: { type: ["string", "null"] }
        category: { type: string }
        price: { type: number }
        cost: { type: number }
        stock: { type: number }
        minStock: { type: number }
        unit: { type: string }
        productType: { type: string, enum: [product, service] }
        taxRateId: { type: ["string", "null"], format: uuid }
        active: { type: boolean }
      required: [id, name, category, price, cost, stock, minStock, unit, productType, active]
    ProductInput:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        sku: { type: ["string", "null"] }
        barcode: { type: ["string", "null"] }
        category: { type: string }
        price: { type: number, minimum: 0 }
        cost: { type: number, minimum: 0 }
        stock: { type: number, minimum: 0 }
        minStock: { type: number, minimum: 0 }
        unit: { type: string }
        productType: { type: string, enum: [product, service] }
        taxRateId: { type: ["string", "null"], format: uuid }
      required: [name, category, price, cost, stock, minStock, unit, productType]
    ProductUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        sku: { type: ["string", "null"] }
        barcode: { type: ["string", "null"] }
        category: { type: string }
        price: { type: number, minimum: 0 }
        cost: { type: number, minimum: 0 }
        minStock: { type: number, minimum: 0 }
        unit: { type: string }
        productType: { type: string, enum: [product, service] }
        taxRateId: { type: ["string", "null"], format: uuid }
        active: { type: boolean }
    SaleLineInput:
      type: object
      properties:
        productId: { type: string, format: uuid }
        quantity: { type: number, exclusiveMinimum: 0 }
      required: [productId, quantity]
    PaymentInput:
      type: object
      properties:
        method: { type: string, enum: [cash, card, transfer, credit] }
        amount: { type: number, exclusiveMinimum: 0 }
      required: [method, amount]
    SaleInput:
      type: object
      properties:
        customerId: { type: ["string", "null"], format: uuid }
        items:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/SaleLineInput" }
        discountAmount: { type: number, minimum: 0 }
        payments:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/PaymentInput" }
        note: { type: ["string", "null"] }
      required: [items, discountAmount, payments]
    SaleLine:
      type: object
      properties:
        productId: { type: string }
        name: { type: string }
        quantity: { type: number }
        unitPrice: { type: number }
        lineTotal: { type: number }
        taxAmount: { type: number }
      required: [productId, name, quantity, unitPrice, lineTotal, taxAmount]
    Sale:
      type: object
      properties:
        id: { type: string, format: uuid }
        receiptNumber: { type: string }
        customerName: { type: ["string", "null"] }
        status: { type: string, enum: [completed, refunded, partial] }
        subtotal: { type: number }
        discountAmount: { type: number }
        taxAmount: { type: number }
        total: { type: number }
        paymentSummary: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/SaleLine" }
        createdAt: { type: string, format: date-time }
      required: [id, receiptNumber, status, subtotal, discountAmount, taxAmount, total, paymentSummary, items, createdAt]
    RefundInput:
      type: object
      properties:
        reason: { type: string, minLength: 1 }
      required: [reason]
    InventoryAdjustmentInput:
      type: object
      properties:
        productId: { type: string, format: uuid }
        quantityChange: { type: number }
        reason: { type: string, enum: [count, damage, loss, correction, return] }
        note: { type: ["string", "null"] }
      required: [productId, quantityChange, reason]
    InventoryAdjustment:
      type: object
      properties:
        id: { type: string, format: uuid }
        productId: { type: string }
        productName: { type: string }
        quantityChange: { type: number }
        reason: { type: string }
        note: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
      required: [id, productId, productName, quantityChange, reason, createdAt]
    ContactInput:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        email: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        taxId: { type: ["string", "null"] }
        address: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
      required: [name]
    Contact:
